<div>
    <section class="py-12">
        <div class="container mx-auto px-5 lg:px-0">
            <h1 class="text-4xl font-semibold mb-12" >
                Add Product
            </h1>
            <form
                [formGroup]="createProductForm" 
                (ngSubmit)="submitForm()"
                class="grid grid-cols-2 gap-6 shadow-md rounded-md p-8">
                <div class="relative">
                    <app-text-input 
                        class="block"
                        [label]="'Product Name'"
                        [type]="'text'"
                        [placeholder]="'product name'"
                        [control]="createProductForm.controls.name"
                    />
                    <app-validation-message 
                        [fieldName]="'product name'"
                        [control]="createProductForm.controls.name"
                    />
                </div>
                <div class="relative">
                    <app-text-input 
                        class="block"
                        [label]="'Product Description'"
                        [type]="'text'"
                        [placeholder]="'product description'"
                        [control]="createProductForm.controls.description"
                    />
                    <app-validation-message 
                        [fieldName]="'product description'"
                        [control]="createProductForm.controls.description"
                    />
                </div>
                <div class="relative">
                    <app-text-input 
                        class="block"
                        [label]="'Price'"
                        [type]="'text'"
                        [placeholder]="'price'"
                        [control]="createProductForm.controls.price"
                    />
                    <app-validation-message 
                        [fieldName]="'price'"
                        [control]="createProductForm.controls.price"
                    />
                </div>
                <div class="relative">
                    <app-text-input 
                        class="block"
                        [label]="'Stock'"
                        [type]="'number'"
                        [placeholder]="'stock'"
                        [control]="createProductForm.controls.stock"
                    />
                    <app-validation-message 
                        [fieldName]="'stock'"
                        [control]="createProductForm.controls.stock"
                    />
                </div>
                <div class="relative">
                    <app-text-input 
                        class="block"
                        [label]="'Category Id'"
                        [type]="'number'"
                        [placeholder]="'category id'"
                        [control]="createProductForm.controls.category_id"
                    />
                    <app-validation-message 
                        [fieldName]="'category id'"
                        [control]="createProductForm.controls.category_id"
                    />
                </div>
                <div class="relative">
                    <app-text-input 
                        class="block"
                        [label]="'Image URL'"
                        [type]="'text'"
                        [placeholder]="'Image URL'"
                        [control]="createProductForm.controls.image_path"
                    />
                    <app-validation-message 
                        [fieldName]="'image url'"
                        [control]="createProductForm.controls.image_path"
                    />
                </div>
                <div class="col-span-2">
                    <button 
                        type="submit"
                        class="w-full p-4 bg-black text-white rounded-md">
                        {{ isEditMode() ? 'Update produk' : 'Tambah produk' }}
                    </button>
                </div>
            </form>
        </div>
    </section>
</div>
