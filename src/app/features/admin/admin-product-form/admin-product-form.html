<div>
    <section class="py-12">
        <div class="container mx-auto px-5 lg:px-0">
            <h1 class="text-4xl font-semibold mb-12" >Add Product</h1>
            <form
                [formGroup]="createProductForm" 
                (ngSubmit)="submitForm()"
                class="grid grid-cols-2 gap-6 shadow-md rounded-md p-8">
                <app-text-input 
                    class="block"
                    [label]="'Name'"
                    [type]="'text'"
                    [placeholder]="'Product Name'"
                    [control]="createProductForm.controls.name"
                />
                <app-text-input 
                    class="block"
                    [label]="'Description'"
                    [type]="'text'"
                    [placeholder]="'Product Description'"
                    [control]="createProductForm.controls.description"
                />
                <app-text-input
                    class="block"
                    [label]="'Price'"
                    [type]="'number'"
                    [placeholder]="'Product Price'"
                    [control]="createProductForm.controls.price"
                 />
                <app-text-input
                    class="block"
                    [label]="'Stock'"
                    [type]="'number'"
                    [placeholder]="'Product Stock'"
                    [control]="createProductForm.controls.stock"
                />
                <app-text-input
                    class="block"
                    [label]="'Category Id'"
                    [type]="'number'"
                    [placeholder]="'Product Category Id'"
                    [control]="createProductForm.controls.category_id"
                />
                <app-text-input
                    class="block"
                    [label]="'Image URL'"
                    [type]="'text'"
                    [placeholder]="'Product Image URL'"
                    [control]="createProductForm.controls.image_path"
                />
                <div class="col-span-2">
                    <button 
                        type="submit"
                        class="w-full p-4 bg-black text-white rounded-md">
                        {{ isEditMode() ? 'Update produk' : 'Tambah produk' }}
                    </button>
                </div>
            </form>
        </div>
    </section>
</div>
