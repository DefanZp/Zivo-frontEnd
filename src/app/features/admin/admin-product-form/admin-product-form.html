<div>
    <section class="py-12">
        <div class="container mx-auto px-5 lg:px-0">
            <h1 class="text-4xl font-semibold mb-12" >Add Product</h1>
            <form
                [formGroup]="createProductForm" 
                (ngSubmit)="submitForm()"
                class="grid grid-cols-2 gap-6 shadow-md rounded-md p-8">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Name
                    </label>
                    <input 
                        type="text"  
                        class="w-full p-4 border border-gray-200 rounded-md"
                        placeholder="Name"
                        formControlName="name">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Description
                    </label>
                    <input 
                        type="text"  
                        class="w-full p-4 border border-gray-200 rounded-md"
                        placeholder="Description"
                        formControlName="description">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Price
                    </label>
                    <input 
                        type="number"  
                        class="w-full p-4 border border-gray-200 rounded-md"
                        placeholder="Price"
                        formControlName="price">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Stock 
                    </label>
                    <input 
                        type="number"  
                        class="w-full p-4 border border-gray-200 rounded-md"
                        placeholder="Stock"
                        formControlName="stock">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Category Id 
                    </label>
                    <input 
                        type="number"  
                        class="w-full p-4 border border-gray-200 rounded-md"
                        placeholder="Category Id"
                        formControlName="category_id">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Image 
                    </label>
                    <input 
                        type="text"  
                        class="w-full p-4 border border-gray-200 rounded-md"
                        placeholder="Image Path"
                        formControlName="image_path">
                </div>
                <div class="col-span-2">
                    <button 
                        type="submit"
                        class="w-full p-4 bg-black text-white rounded-md">
                        {{ isEditMode() ? 'Update produk' : 'Tambah produk' }}
                    </button>
                </div>
            </form>
        </div>
    </section>
</div>
