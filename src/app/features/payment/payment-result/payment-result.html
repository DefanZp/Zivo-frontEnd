<div class="min-h-[70vh] flex items-center justify-center px-5">
    <div class="w-full max-w-md text-center">

        <!-- Status Icon -->
        <div class="w-16 h-16 mx-auto rounded-full bg-ink-100 flex items-center justify-center mb-5">

            @switch (getStatusIcon()) {

                @case ('success') {
                    <svg
                        class="w-8 h-8 text-ink-900"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7" />
                    </svg>
                }

                @case ('pending') {
                    <svg
                        class="w-8 h-8 text-ink-900"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 8v4l3 2M12 21a9 9 0 100-18 9 9 0 000 18z" />
                    </svg>
                }

                @case ('expired') {
                    <svg
                        class="w-8 h-8 text-ink-900"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 8v4l3 2M12 21a9 9 0 100-18 9 9 0 000 18z" />
                    </svg>
                }

                @case ('cancelled') {
                    <svg
                        class="w-8 h-8 text-ink-900"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                }

                @case ('failed') {
                    <svg
                        class="w-8 h-8 text-ink-900"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 9v4m0 4h.01M10.29 3.86l-7.5 12.99A2 2 0 004.53 20h14.94a2 2 0 001.73-3.15l-7.5-12.99a2 2 0 00-3.41 0z" />
                    </svg>
                }

                @default {
                    <svg
                        class="w-8 h-8 text-ink-900"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 6v6l4 2M12 22a10 10 0 100-20 10 10 0 000 20z" />
                    </svg>
                }
            }

        </div>

        <!-- Title -->
        <h1 class="heading-24s text-ink-950">
            {{ getStatusTitle() }}
        </h1>

        <!-- Message -->
        <p class="paragraph-14r text-ink-500 mt-2">
            {{ getStatusMessage() }}
        </p>

        <!-- Order ID -->
        @if (orderId) {
            <div class="mt-5">
                <p class="paragraph-12r text-ink-400">
                    Order ID
                </p>

                <p class="paragraph-14s text-ink-900 mt-1">
                    {{ orderId }}
                </p>
            </div>
        }

        <!-- Actions -->
        <div class="flex flex-col gap-3 mt-6">

            <a
                routerLink="/user/orders"
                class="w-full px-5 py-3 bg-ink-950 text-white rounded-lg">
                View My Orders
            </a>

            <a
                routerLink="/products"
                class="w-full px-5 py-3 border border-ink-200 text-ink-900 rounded-lg">
                Continue Shopping
            </a>

        </div>

    </div>
</div>
