<section class="py-12">
    <div class="container flex items-center justify-center mx-auto px-5 lg:px-0 ">
        <div class="w-full min-h-fit md:min-h-[85vh] flex flex-col md:flex-row bg-white rounded-xl shadow-md overflow-hidden">
            <div 
                style="background-image: url(/background/loginbg.jpg);"
                class="hidden md:block md:w-[40%] bg-cover bg center relative">
                <div class="absolute z-10 inset-0 bg-linear-to-b from-black/10 to-black/60 rounded-l-xl">
                </div>
                <div class="absolute z-20 inset-0 p-8 flex flex-col justify-between h-full">
        
                    <div class="flex items-center gap-3.5">
                        <div class="w-8">
                            <img src="zivo-logo-z-only-reverse.png" alt="Logo" class="w-full h-full object-contain">
                        </div>
                        <div class="heading-24s text-white">Zivo</div>
                    </div>

                    <div class="w-full ">
                        <h2 class="heading-32s text-white mb-3">Curated for you.</h2>
                        <p class="paragraph-14r text-ink-200">
                            Sign in to discover personalized recommendations and early access to our newest arrivals.
                        </p>
                    </div>

                </div>
            </div>
            <div class="w-full md:w-[60%] flex flex-col justify-center items-center py-6 px-4">
                <div class="w-full max-w-md text-left mb-6">
                    <h1 class="heading-24s md:heading-32s text-ink-950">Welcome back</h1>
                    <p class="text-ink-500 mt-2 paragraph-14r">
                        Sign in to access your saved items and track your orders.
                    </p>
                </div>
                <form 
                    [formGroup]="loginForm"
                    (ngSubmit)="submitLogin()"
                    class="space-y-4 md:space-y-6 w-full max-w-md">
                    @if (errorMessage()) {
                        <div class="flex items-start sm:items-center p-4 mb-4 text-sm text-red-700 rounded-md bg-red-100" role="alert">
                            <svg class="w-4 h-4 me-2 shrink-0 mt-0.5 sm:mt-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                            <p>{{ errorMessage() }}</p>
                        </div>
                    }
                    <div class="relative">
                        <app-text-input 
                            class="block"
                            [label]="'Your email'"
                            [type]="'email'"
                            [placeholder]="'name@example.com'"
                            [control]="loginForm.controls.email"
                        />
                        <app-validation-message 
                            [fieldName]="'email'"
                            [control]="loginForm.controls.email"
                        />
                    </div>
                    <div class="relative">
                        <app-text-input 
                            class="block"
                            [label]="'Password'"
                            [type]="'password'"
                            [placeholder]="'••••••••'"
                            [control]="loginForm.controls.password"
                        />
                        <app-validation-message 
                            [fieldName]="'password'"
                            [control]="loginForm.controls.password"
                        />
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-start">
                            <div class="flex items-center h-5">
                                <input id="remember" aria-describedby="remember" type="checkbox" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 " required="">
                            </div>
                            <div class="ml-3 text-sm">
                                <label for="remember" class="text-gray-500 dark:text-gray-300">Remember me</label>
                            </div>
                        </div>
                        <a href="#" class="text-sm font-medium text-primary-600 hover:underline dark:text-primary-500">Forgot password?</a>
                    </div>
                    <button 
                        type="submit" 
                        [disabled]="loading()"
                        class="w-full text-white bg-ink-950 hover:bg-ink-800 rounded-lg paragraph-14r px-5 py-2.5 disabled:opacity-50 flex items-center justify-center gap-2 cursor-pointer">
                        @if (loading()) {
                        <svg 
                            class="animate-spin h-4 w-4 text-white" 
                            xmlns="http://www.w3.org/2000/svg" 
                            fill="none" 
                            viewBox="0 0 24 24">
                            <circle 
                                class="opacity-25" 
                                cx="12" cy="12" r="10" 
                                stroke="currentColor" 
                                stroke-width="4">
                            </circle>
                            <path 
                                class="opacity-75" 
                                fill="currentColor" 
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z">
                            </path>
                        </svg>
                        Signing in...
                    } @else {
                        Sign in
                    }
                    </button>
                    <p class="text-center paragraph-14r text-ink-500 dark:text-gray-400">
                        Don't have an account yet? <a routerLink="/auth/register" class="paragraph-14s text-ink-900 hover:underline dark:text-primary-500">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</section>
