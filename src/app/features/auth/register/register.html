<section class="py-12">
    <div class="container flex items-center justify-center mx-auto px-5 lg:px-0 ">
        <div class="w-full h-[85vh] flex flex-row bg-white rounded-xl shadow-md">
            <div 
                style="background-image: url(/background/shopping.jpg);"
                class="w-[30%] h-full bg-cover bg-center rounded-l-xl relative">
                <div class="absolute inset-0 bg-linear-to-b from-black/10 to-black/60 rounded-l-xl">
                </div>
            </div>
            <div class="w-[70%] flex flex-col justify-center items-center">
                <form 
                    [formGroup]="registerForm"
                    (ngSubmit)="submitRegister()"
                    class="space-y-4 md:space-y-6  w-[400px]">
                    @if (errorMessage()) {
                        <div class="flex items-start sm:items-center p-4 mb-4 text-sm text-red-700 rounded-md bg-red-100" role="alert">
                            <svg class="w-4 h-4 me-2 shrink-0 mt-0.5 sm:mt-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                            <p>{{ errorMessage() }}</p>
                        </div>
                    }
                    <app-text-input 
                        class="block"
                        [label]="'Your name'"
                        [type]="'text'"
                        [placeholder]="'your name'"
                        [control]="registerForm.controls.name"
                    />
                    <app-text-input 
                        class="block"
                        [label]="'Your email'"
                        [type]="'email'"
                        [placeholder]="'your email'"
                        [control]="registerForm.controls.email"
                    />
                    <app-text-input 
                        class="block"
                        [label]="'Password'"
                        [type]="'password'"
                        [placeholder]="'••••••••'"
                        [control]="registerForm.controls.password"
                    />
                    <app-text-input 
                        class="block"
                        [label]="'Confirm Password'"
                        [type]="'password'"
                        [placeholder]="'••••••••'"
                        [control]="registerForm.controls.password_confirmation"
                    />
                    <button 
                        type="submit" 
                        [disabled]="loading()"
                        class="w-full text-white bg-black rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 flex items-center justify-center gap-2">
                        @if (loading()) {
                        <svg 
                            class="animate-spin h-4 w-4 text-white" 
                            xmlns="http://www.w3.org/2000/svg" 
                            fill="none" 
                            viewBox="0 0 24 24">
                            <circle 
                                class="opacity-25" 
                                cx="12" cy="12" r="10" 
                                stroke="currentColor" 
                                stroke-width="4">
                            </circle>
                            <path 
                                class="opacity-75" 
                                fill="currentColor" 
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z">
                            </path>
                        </svg>
                        Signing in...
                    } @else {
                        Sign up
                    }
                    </button>
                    <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                        Already have an account? <a routerLink="/auth/login" class="font-medium text-primary-600 hover:underline dark:text-primary-500">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</section>
