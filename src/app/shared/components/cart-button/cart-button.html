<button
    [type]="type()"
    [disabled]="addingToCart() || isInCart()"
    class="w-full p-4 bg-black text-white rounded-md mt-6 cursor-pointer
    disabled:opacity-50 disabled:cursor-not-allowed">
    @if (addingToCart()) {
        <div class="flex flex-row gap-3 items-center justify-center">
            <div
                class="w-6 h-6 rounded-full border-[3px] border-ink-200 border-t-ink-950 animate-spin"
            ></div>
            {{ loadingText() }}
        </div>
    } @else {
        {{ isInCart() ? 'Already in Cart' : 'Add to Cart' }}
    }
</button>
