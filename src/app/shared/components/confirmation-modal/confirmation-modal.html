@if (isOpen()) {
<div class="fixed inset-0 bg-black/45 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-xl p-6 w-full max-w-md">

    <!-- Icon — berubah sesuai variant -->
    <div class="w-11 h-11 rounded-full flex items-center justify-center mb-4"
      [class]="iconContainerClass()">

      @if (variant() === 'danger') {
        <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      }

      @else if (variant() === 'warning') {
        <svg class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
      }

      @else {
        <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      }

    </div>

    <!-- Title dan description -->
    <h2 class="text-base font-medium text-zinc-900 dark:text-zinc-100 mb-1.5">
      {{ title() }}
    </h2>
    <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-4 leading-relaxed">
      {{ description() }}
    </p>

    <!-- Warning notice — hanya tampil kalau warningText diisi -->
    @if (warningText()) {
      <div class="flex items-center gap-2 text-xs text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950 border border-amber-200 dark:border-amber-800 rounded-lg px-3 py-2.5 mb-6">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
        {{ warningText() }}
      </div>
    }

    <!-- Tombol aksi -->
    <div class="flex justify-end gap-2">
      <button
        type="button"
        [disabled]="loading()"
        (click)="cancel.emit()"
        class="px-4 py-2 text-sm border border-zinc-200 dark:border-zinc-700 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-800 disabled:opacity-50 transition">
        {{ cancelText() }}
      </button>

      <button
        type="button"
        [disabled]="loading()"
        (click)="confirm.emit()"
        class="px-4 py-2 text-sm text-white rounded-lg disabled:opacity-60 disabled:cursor-not-allowed flex items-center gap-2 transition"
        [class]="confirmButtonClass()">

        @if (loading()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          {{ loadingText() }}
        } @else {
          {{ confirmText() }}
        }

      </button>
    </div>

  </div>
</div>
}
