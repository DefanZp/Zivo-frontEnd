<button
    [type]="type()"
    [disabled]="loading()"
    class="w-full px-4 py-2.5 bg-ink-950 hover:bg-ink-800 text-white rounded-lg cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed paragraph-14r">
        <span>
            @if (loading()) {
                <div class="flex flex-row gap-3 items-center justify-center">
                    <div
                        class="w-6 h-6 rounded-full border-[3px] border-ink-200 border-t-ink-950 animate-spin"
                    ></div>
                    {{ loadingText() }}
                </div>
            } @else {
                {{ text() }}
            }
        </span>
</button>
