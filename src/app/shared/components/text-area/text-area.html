<div class="relative">
    <label 
        [htmlFor]="label()" 
        class="block mb-1.5 paragraph-14r text-ink-950 dark:text-white">
        {{ label() }}
    </label>
    <textarea 
        [id]="label()"
        [formControl]="control()"
        [placeholder]="placeholder()"
        [rows]="rows()"
        class="w-full px-3.5 py-2.5 text-sm md:text-base text-ink-900 bg-white border border-gray-300 
            rounded-lg shadow-xs transition-all duration-200 ease-in-out focus:outline-none focus:border-ink-950 focus:ring-2 focus:ring-ink-950/15 resize-y"
    ></textarea>
</div>
